name: CI

# Checks what other repositories consume from here: the renovate-soak action's script (its self-test, ruff) and
# the Renovate presets (Renovate's own validator). A broken push here breaks every repository that extends the
# presets or pins the action, so main should only move through a pull request with this green.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The script's built-in good and bad cases; offline, no token needed. -I as in action.yml.
      - name: renovate-soak self-test
        run: python3 -I actions/renovate-soak/renovate_soak.py --self-test

      # Exact version, the one Noctran/Homelab's pre-commit config pins; pipx ships with the hosted runner image.
      - name: ruff
        run: |
          pipx run ruff==0.17.0 check .
          pipx run ruff==0.17.0 format --check .

      # Exact version, the one build-01 runs (Homelab infrastructure/hosts/docker/build-01/docker-compose.yaml).
      - name: Renovate presets
        run: npx --yes --package renovate@44.149.3 -- renovate-config-validator --strict renovate-config.json soak.json renovate.json
